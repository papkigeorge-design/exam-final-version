<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUCCESS COACH - Members</title>
    <link rel="stylesheet" href="../stylesheets/reset.css">
    <link rel="stylesheet" href="../stylesheets/members.css">
</head>
<body>
    <div>
        <iframe src="../html pages/navigationbar.html" frameborder="0" class="container"></iframe>
    </div>
<section class="main">
    <div class="big-card">
        <div class="mini-card-top">
            <button type="button" class="filter">
                <span>All members</span>
                <img src="../image/icons/arrow-down.svg" alt="">
            </button>
            <div class="tools">
                <div class="views">
                    <button type="button"><img src="../image/icons/grid.svg" alt="Grid view"></button>
                    <button type="button"><img src="../image/icons/list.svg" alt="List view"></button>
                </div>
                <div class="search">
                    <img src="../image/icons/search.svg" alt="">
                    <input type="text" placeholder="Find a member...">
                    <span>0</span>
                </div>
            </div>
        </div>
        <div class="mini-card-bottom">
            <h2>Log in to connect with members</h2>
            <p>View and follow other members, leave comments &amp; more.</p>
            <button type="button" class="login">Log In</button>
        </div>
    </div>
</section>
    <div class="footer-container">
        <iframe src="../html pages/footer.html" frameborder="0" class="footer-iframe"></iframe>
    </div>
</body>
</html>
