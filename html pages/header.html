    <script>
        const burger = document.querySelector(".burger");
        const menu = document.querySelector(".menu");
        const desktop = window.matchMedia("(min-width: 1001px)");

        // the header lives in an iframe, so grow the iframe to fit the open menu
        function resizeFrame(open) {
            try {
                const box = window.frameElement.closest(".container");
                box.style.height = open ? (80 + menu.offsetHeight) + "px" : "";
            } catch (error) {}
        }

        function toggleMenu(open) {
            menu.classList.toggle("open", open);
            burger.setAttribute("aria-expanded", open);
            resizeFrame(open);
        }

        burger.addEventListener("click", () => toggleMenu(!menu.classList.contains("open")));

        // close the menu if the screen gets wide again
        desktop.addEventListener("change", (e) => {
            if (e.matches) toggleMenu(false);
        });
    </script>
